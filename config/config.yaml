# Direct large/mid-size company career sites + LinkedIn new-grad search.
# Full Greenhouse/Lever/Ashby/Workday/SmartRecruiters catalog: config/ats_boards.yaml
# Regenerated with: python scripts/build_ats_boards.py
ats_boards_file: config/ats_boards.yaml

sources:
  greenhouse:
    enabled: true
    workers: 12

  lever:
    enabled: true
    workers: 10

  ashby:
    enabled: true
    workers: 10

  smartrecruiters:
    enabled: true
    workers: 6

  workday:
    enabled: true
    limit: 20
    board_workers: 8
    search_terms:
      - Data Scientist
      - Data Analyst
      - Machine Learning
      - Quantitative Analyst
      - New Grad Data
      - Early Career Data

  first_party:
    enabled: true
    search_terms:
      - Data Scientist
      - Data Analyst
      - Machine Learning
      - AI Engineer
      - New Grad Data Scientist
      - New Grad Data Analyst
    limit_per_term: 40
    sites:
      - amazon
      - netflix
      - microsoft

  linkedin:
    enabled: true  # guest scrape (no login); 3-layer repost & non-new-grad filter
    location: United States
    hours_old: 48
    results_per_search: 15
    search_terms:
      - new grad Data Scientist
      - new grad Data Analyst
      - new grad AI Engineer
      - new grad Machine Learning Engineer
      - recent graduate Data Scientist
      - recent graduate Data Analyst
      - entry level Data Scientist
      - entry level Data Analyst
      - entry level AI Engineer
      - junior Data Scientist
      - junior Data Analyst
      - Data Scientist I
      - Data Analyst I
      - university grad Data Scientist

# Email only jobs scoring at or above this (0–1)
# 0.60 catches known-company DA/DS near-misses (e.g. Spotify 1+ years scored 0.62)
score_threshold: 0.60

# Max jobs included in a single digest email per run
max_jobs_per_email: 8

# Email Data Scientist @ target companies immediately (don't wait for digest to fill)
send_priority_ds_immediately: true

# Cap how many NEW jobs get LLM-scored per run (avoids burning quota on first Greenhouse dump)
max_score_per_run: 40

# Only keep US (or US-remote) roles. Unclear cities / "N Locations" without a
# US country code are dropped. Generic "Remote" with no foreign country still passes.
require_us: true
reject_unknown_location: true

# Only keep undergrad / bachelor's new-grad / entry-level roles.
# Rejects PhD/research tracks, 2+ years experience in JD, and senior titles.
# Strict mode requires an explicit new-grad/junior/entry signal in the TITLE
# (title-family match alone is not enough).
require_new_grad: true
strict_new_grad: true
undergrad_only: true
newgrad_require_title_signal: true

# Freshness: only alert on true first-publish date (ignore ATS updated_at repost bumps).
reject_reposts: true
max_job_age_minutes: 10080  # 7 days
require_recent_timestamp: false  # allow LinkedIn/Handshake jobs missing dates
max_repost_age_days: 7  # backup guard when reject_reposts is off
# Never-emailed scored jobs can still catch up within this window (digest overflow)
catchup_grace_minutes: 10080  # 7 days

# Auto-delete seen_jobs rows older than this many days (45d keeps fingerprint history to block LinkedIn reposts)
db_retention_days: 45

title_families:
  data_analyst:
    match:
      - data analyst
      - junior data analyst
      - analytics analyst
      - business data analyst
      - product data analyst
      - marketing data analyst
      - operations analyst
      - decision analyst
      - insights analyst
      - bi analyst
      - business intelligence analyst
    possible:
      - business analyst
      - product analyst
      - strategy analyst
      - analytics associate
    reject:
      - financial analyst
      - investment analyst
      - cybersecurity analyst
      - senior data analyst
      - director of analytics
      - staff data analyst
      - principal data analyst
      - lead data analyst

  data_scientist:
    match:
      - data scientist
      - junior data scientist
      - associate data scientist
      - decision scientist
      - applied data scientist
      - product data scientist
      - machine learning data scientist
      - ai data scientist
      - ml engineer
      - machine learning engineer
    possible:
      - applied scientist
    reject:
      - research scientist
      - research data scientist
      - senior data scientist
      - staff data scientist
      - principal data scientist
      - director of data science
      - vp of data

  ai_engineer:
    match:
      - ai engineer
      - junior ai engineer
      - associate ai engineer
      - llm engineer
      - rag engineer
      - generative ai engineer
      - genai engineer
      - ai/ml engineer
      - applied ai engineer
      - mlops engineer
      - prompt engineer
      - ai agent
      - agentic
    possible:
      - ai developer
      - llm
      - generative ai
      - foundation model
    reject:
      - senior ai engineer
      - staff ai engineer
      - principal ai engineer
      - director of ai
      - vp of ai
      - research engineer
      - applied ai architect
      - ai architect
      - software engineer
      - software developer
      - ai software engineer
      - machine learning software engineer

